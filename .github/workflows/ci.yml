name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK and test dependencies
        run: pip install -r tests/requirements.txt
      - name: Run offline unit tests (no appliance required)
        run: pytest tests/ -v -k "not smoke_live"
      - name: Say so when the live tests are skipped
        if: ${{ vars.TRAFFICGEN_BASE_URL == '' && matrix.python-version == '3.12' }}
        run: echo "::notice title=Live tests skipped::Repository variable TRAFFICGEN_BASE_URL is not set, so the live smoke tests and the Robot job did not run. Set it under Settings > Secrets and variables > Actions > Variables."
      - name: Run live smoke tests (only when an appliance is configured)
        if: ${{ vars.TRAFFICGEN_BASE_URL != '' }}
        env:
          TRAFFICGEN_BASE_URL: ${{ vars.TRAFFICGEN_BASE_URL }}
          TRAFFICGEN_USER: ${{ secrets.TRAFFICGEN_USER }}
          TRAFFICGEN_PASS: ${{ secrets.TRAFFICGEN_PASS }}
          TRAFFICGEN_VERIFY_TLS: ${{ vars.TRAFFICGEN_VERIFY_TLS }}   # set to 0 only for a self-signed certificate
        run: pytest tests/test_smoke_live.py -v

  robot:
    runs-on: ubuntu-24.04
    if: ${{ vars.TRAFFICGEN_BASE_URL != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r robot/requirements.txt
      - name: Run Robot Framework suite
        env:
          TRAFFICGEN_BASE_URL: ${{ vars.TRAFFICGEN_BASE_URL }}
          TRAFFICGEN_USER: ${{ secrets.TRAFFICGEN_USER }}
          TRAFFICGEN_PASS: ${{ secrets.TRAFFICGEN_PASS }}
          TRAFFICGEN_VERIFY_TLS: ${{ vars.TRAFFICGEN_VERIFY_TLS }}   # set to 0 only for a self-signed certificate
        run: robot --outputdir robot/results robot/example.robot
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: robot-results
          path: robot/results

  publish-api-docs:
    runs-on: ubuntu-24.04
    needs: pytest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish docs/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
