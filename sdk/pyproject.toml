[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficgen-sdk"
version = "0.1.0"
description = "Python SDK for the Packetronix Traffic Generator REST API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[tool.setuptools.packages.find]
include = ["trafficgen_sdk*"]
